services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ruangsoal
      POSTGRES_USER: ruangsoal
      POSTGRES_PASSWORD: ruangsoal-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ruangsoal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruangsoal -d ruangsoal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ruangsoal-postgres:
